<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Docentes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="card">
        <h2>REGISTRO DE DOCENTE</h2>
        {% with messages = get_flashed_messages() %}
          {% if messages %}{% for message in messages %}<div class="flash-error">{{ message }}</div>{% endfor %}{% endif %}
        {% endwith %}
        <form action="/docente/registro" method="POST">
            <div class="form-group">
                <label>Nombre Completo</label>
                <input type="text" name="nombre" required placeholder="Prof. Juan Pérez">
            </div>
            <div class="form-group">
                <label>Área / Materia</label>
                <input type="text" name="asignatura" required placeholder="Ej. Matemáticas u Orientación">
            </div>
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" name="correo" required placeholder="docente@ejemplo.com">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary">Crear Cuenta</button>
        </form>
        <div class="link-text">¿Ya tienes cuenta? <a href="/docente/login">Inicia sesión</a></div>
    </div>
</body>
</html>
