<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Docentes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="card">
        <h2>PORTAL DOCENTE</h2>
        {% with messages = get_flashed_messages() %}
          {% if messages %}{% for message in messages %}<div class="flash-error">{{ message }}</div>{% endfor %}{% endif %}
        {% endwith %}
        <form action="/docente/login" method="POST">
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" name="correo" required placeholder="docente@ejemplo.com">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
        </form>
        <div class="link-text">¿No tienes cuenta? <a href="/docente/registro">Regístrate aquí</a></div>
        <a href="/" class="back-link" style="margin-top: 15px; display: block;">← Volver al menú principal</a>
    </div>
</body>
</html>
