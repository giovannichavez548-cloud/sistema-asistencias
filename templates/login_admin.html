<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrador</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>ACCESO ADMINISTRADOR</h2>
            {% with messages = get_flashed_messages() %}
              {% if messages %}{% for message in messages %}<div class="flash-error">{{ message }}</div>{% endfor %}{% endif %}
            {% endwith %}
            <form action="/admin/login" method="POST">
                <div class="form-group">
                    <label>Correo</label>
                    <input type="email" name="correo" required placeholder="administrador@ejemplo.com">
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" name="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary">Ingresar al Escáner</button>
            </form>
            <a href="/" class="back-link" style="margin-top: 20px; display: block;">← Volver al menú principal</a>
        </div>
    </div>
</body>
</html>
